<div *ngIf="selected">
  <app-user-detail [userDetail]="selectedUser"></app-user-detail>
</div>


<hr />


<div class="container-fluid">
  <div class="row">
    <div *ngFor="let user of users" class="col mb-2">
      <div class="card p-2" style="width: 15rem; height: 33rem">
        <img
          class="card-img-top"
          src="{{ user.avatarUrl }}"
          alt="{{ user.name }}"
          (click)="onSelected(user)"
        />
        <div class="card-body">
          <h5 class="card-title">{{ user.name }}</h5>
          <p class="card-text">[{{ user.role }}]</p>
        </div>
      </div>
    </div>
  </div>
</div>
