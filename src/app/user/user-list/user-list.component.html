<div class="user-container">
  <div class="user-list-panel">
    <div class="list-header">
      <h2>Usuarios Activos</h2>
      <span class="user-count">{{ users.length }} Usuarios</span>
    </div>
    <div class="user-list-scroll">
      <div *ngFor="let user of users" 
           class="user-card" 
           [class.active]="selected && selectedUser.id === user.id"
           (click)="onSelected(user)">
        <img src="{{ user.avatarUrl }}" alt="{{ user.name }}" class="user-avatar" />
        <div class="user-info">
          <h3>{{ user.name }}</h3>
          <span class="user-role">{{ user.role }}</span>
          <p class="user-subtitle">{{ user.username }}</p>
        </div>
      </div>
    </div>
  </div>

  <div class="user-detail-panel" *ngIf="selected">
    <app-user-detail [userDetail]="selectedUser"></app-user-detail>
  </div>

  <div class="user-detail-panel" *ngIf="!selected">
    <div class="empty-state">
      <span class="material-icons empty-icon">person_search</span>
      <p>Selecciona un usuario para ver su perfil</p>
    </div>
  </div>
</div>
